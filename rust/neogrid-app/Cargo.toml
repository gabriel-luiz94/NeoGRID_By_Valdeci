[package]
name = "neogrid-app"
version = "3.0.2"
edition = "2021"
description = "NeoGrid: console desktop de redes, postes e ativos elétricos (shell Tauri)"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
ureq = { version = "3", features = ["rustls"] }
include_dir = "0.7"
tiny_http = "0.12"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
neogrid-query = { path = "../neogrid-query" }
neogrid-build = { path = "../neogrid-build" }

[package]
name = "neogrid-query"
version = "0.1.0"
edition = "2021"
description = "Leitura da base SQLite do NeoGrid (paridade com electron/database.js)"

[lib]
name = "neogrid_query"
crate-type = ["rlib"]

[[bin]]
name = "neogrid-query-parity"
path = "src/bin/parity.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "functions", "hooks"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
